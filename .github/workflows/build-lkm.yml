name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Consistent KernelSU version code for all module builds'
        required: false
        default: ''
        type: string
      release_build:
        description: 'Mark version metadata as a release build'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
      version_code:
        description: 'version code'
        required: false
        default: ''
      release_build:
        description: 'mark as release build'
        type: boolean
        required: false
        default: false
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
